name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: formagen_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/formagen_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate the test database
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: npm run build
      # Full flow, no-JS submit and axe WCAG 2.2 AA scans; the config starts `next start`
      # with E2E_TEST_LOGIN=1 (only ever set here, never in a deployed stage).
      - run: npm run e2e
      # Performance budgets on the public form (mobile preset, median of 3 runs); see lighthouserc.json.
      - name: Lighthouse CI
        run: |
          SLUG=$(npm run seed --silent | grep -o '/f/[a-z0-9-]*')
          npx lhci autorun --collect.url="http://localhost:3100$SLUG"
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          AUTH_SECRET: ci-only-secret
          AUTH_TRUST_HOST: "true"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
